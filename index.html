<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lab Cleaning Ledger</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style id="theme-styles">
  /* Light Theme - Warm & Gentle */
  :root {
    --bg-primary: #fafafa;
    --bg-secondary: #f5f5f5;
    --text-primary: #2d3748;
    --text-secondary: #718096;
    --header-border: #4a6fa5;
    --table-header-bg: linear-gradient(135deg, #6b8dbe, #4a6fa5);
    --table-header-text: #ffffff;
    --table-row-hover: #edf2f7;
    --balance-bg: #e6f7ee;
    --credit: #2d7a4f;
    --debit: #c53030;
    --footer-text: #a0aec0;
    --shadow: rgba(0,0,0,0.08);
    --accent-sand: #d69e66;
    --accent-sage: #5c946e;
  }

  /* Dark Theme - Calm & Serene */
  .dark-mode {
    --bg-primary: #1a1f2b;
    --bg-secondary: #141824;
    --text-primary: #e2e8f0;
    --text-secondary: #cbd5e0;
    --header-border: #5a8dbe;
    --table-header-bg: linear-gradient(135deg, #3a5a7e, #2a425e);
    --table-header-text: #f7fafc;
    --table-row-hover: #232a3a;
    --balance-bg: #1e2d28;
    --credit: #4a8c6e;
    --debit: #a54a4a;
    --footer-text: #a0aec0;
    --shadow: rgba(0,0,0,0.3);
    --accent-sand: #c68e56;
    --accent-sage: #4a7a5e;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-secondary);
    color: var(--text-primary);
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  header {
    text-align: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 2px solid var(--header-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 2px;
    background: var(--accent-sand);
    border-radius: 1px;
  }

  h1 {
    color: var(--text-primary);
    margin: 0;
    font-size: 2.0em;
    font-weight: 600;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, var(--header-border), var(--accent-sage));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .theme-toggle {
    background: var(--table-header-bg);
    color: var(--table-header-text);
    border: none;
    padding: 7px 14px;
    border-radius: 18px;
    cursor: pointer;
    font-size: 0.88em;
    font-weight: 500;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
  }

  .theme-toggle:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .last-updated {
    font-size: 0.88em;
    color: var(--text-secondary);
    margin-top: 8px;
  }

  /* Scrollable ledger container */
  #ledger-container {
    max-height: 65vh;
    overflow-y: auto;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 10px;
    margin-bottom: 20px;
    position: relative;
    box-shadow: 0 2px 10px var(--shadow);
    background: var(--bg-primary);
    transition: box-shadow 0.3s ease;
  }

  #ledger-container:hover {
    box-shadow: 0 3px 12px var(--shadow);
  }

  /* Scrollbar styling */
  #ledger-container::-webkit-scrollbar {
    width: 8px;
  }
  #ledger-container::-webkit-scrollbar-track {
    background: var(--bg-secondary);
    border-radius: 4px;
  }
  #ledger-container::-webkit-scrollbar-thumb {
    background: var(--header-border);
    border-radius: 4px;
    border: 2px solid var(--bg-secondary);
  }
  #ledger-container::-webkit-scrollbar-thumb:hover {
    background: var(--accent-sage);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    padding: 9px 11px;
    text-align: left;
    font-size: 0.94em;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    transition: background-color 0.2s ease;
  }
  
  th {
    background: var(--table-header-bg);
    color: var(--table-header-text);
    font-size: 0.86em;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.4px;
    position: sticky;
    top: 0;
    z-index: 10;
    text-shadow: 0 1px 1px rgba(0,0,0,0.15);
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:hover {
    background-color: var(--table-row-hover);
  }

  .balance-row {
    font-weight: 600;
    background: var(--balance-bg) !important;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.06);
  }

  .credit {
    color: var(--credit);
    font-weight: 600;
  }

  .debit {
    color: var(--debit);
    font-weight: 600;
  }

  /* Scroll to bottom button */
  .scroll-to-bottom {
    position: sticky;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--header-border), var(--accent-sage));
    color: white;
    border: none;
    border-radius: 22px;
    padding: 8px 18px;
    font-size: 0.86em;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(74, 111, 165, 0.3);
    display: none;
    z-index: 20;
    transition: all 0.3s ease;
  }

  .scroll-to-bottom.show {
    display: block;
    animation: fadeIn 0.3s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-50%) translateY(8px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .scroll-to-bottom:hover {
    transform: translateX(-50%) scale(1.05);
    box-shadow: 0 3px 10px rgba(74, 111, 165, 0.4);
  }

  footer {
    text-align: center;
    margin-top: 30px;
    color: var(--footer-text);
    font-size: 0.88em;
    line-height: 1.6;
    padding: 18px;
    border-top: 1px solid rgba(0,0,0,0.05);
  }

  footer a {
    color: var(--header-border);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
  }

  footer a:hover {
    color: var(--accent-sage);
    text-decoration: underline;
  }

  @media (max-width: 600px) {
    th, td {
      padding: 7px 9px;
      font-size: 0.9em;
    }
    #ledger-container {
      max-height: 60vh;
      border-radius: 8px;
    }
    .scroll-to-bottom {
      padding: 7px 15px;
      font-size: 0.82em;
    }
    h1 {
      font-size: 1.7em;
    }
  }
</style>
</head>
<body>
  <header>
    <h1>Laboratory Cleaning Fund Ledger</h1>
    <button class="theme-toggle" id="themeToggle">🌓 Toggle Theme</button>
    <div class="last-updated">Live data from Google Sheets</div>
  </header>

  <div id="ledger-container">
    <table id="ledger-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Date</th>
          <th>Debit</th>
          <th>Credit</th>
          <th>Balance</th>
        </tr>
      </thead>
      <tbody id="ledger-body">
        <tr><td colspan="5" style="text-align: center;">Loading ledger...</td></tr>
      </tbody>
    </table>
  </div>

  <button class="scroll-to-bottom" id="scrollToBottom">↓ Latest</button>

  <footer>
    Refresh page to see latest approved entries<br>
    Source at <a href="https://github.com/ravenmojo/tensore-ledger" target="_blank">GitHub</a><br>
    Made with ♥ by <a href="https://ravenmojo.github.io/" target="_blank">Souradeep Satpathy</a><br>
    <a href="https://sites.google.com/view/tensore/home" target="_blank">TENSORE LAB, IIT Kharagpur</a>
  </footer>

  <script>
    // === Theme Management ===
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    // Detect system preference
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedTheme = localStorage.getItem('ledger-theme');

    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      body.classList.add('dark-mode');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      localStorage.setItem('ledger-theme', isDark ? 'dark' : 'light');
    });

    // === Data Formatting ===
    function formatNumber(value) {
      if (value === "" || value == null) return "—";
      const num = parseFloat(value);
      if (isNaN(num)) return "—";
      return num.toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function formatDate(dateStr) {
      if (!dateStr) return "—";
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        if (!isNaN(day) && !isNaN(month) && !isNaN(year) && month >= 0 && month <= 11 && day >= 1 && day <= 31) {
          const date = new Date(year, month, day);
          if (date.getFullYear() === year && date.getMonth() === month && date.getDate() === day) {
            return `${String(day).padStart(2, '0')}/${String(month + 1).padStart(2, '0')}/${year}`;
          }
        }
      }
      return dateStr;
    }

    // === Scroll Management ===
    const container = document.getElementById("ledger-container");
    const scrollToBottomBtn = document.getElementById("scrollToBottom");

    // Show button when scrolled up more than 50px
    container.addEventListener("scroll", () => {
      if (container.scrollTop > 50) {
        scrollToBottomBtn.classList.add("show");
      } else {
        scrollToBottomBtn.classList.remove("show");
      }
    });

    // Scroll to bottom button functionality
    scrollToBottomBtn.addEventListener("click", () => {
      container.scrollTo({
        top: container.scrollHeight,
        behavior: "smooth"
      });
    });

    // === Fetch and Render Data ===
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSIvmo5aD2rAjv245M91KCPIlVw9u5qH3K112QnJE7iVokxUEK6NiSj1TpzHWfWd_NybBljUHqf2MBA/pub?gid=0&single=true&output=csv";

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const tbody = document.getElementById("ledger-body");
        tbody.innerHTML = "";

        if (results.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">No data available</td></tr>`;
          return;
        }

        // Render data in ORIGINAL chronological order (oldest first, newest last)
        results.data.forEach(row => {
          const tr = document.createElement("tr");
          const isSummaryRow = (!row["Name"] || row["Name"].toString().trim() === "") && row["Balance"];

          if (isSummaryRow) {
            tr.classList.add("balance-row");
            tr.innerHTML = `
              <td colspan="4" style="text-align: right;"><strong>Current Balance:</strong></td>
              <td>${formatNumber(row["Balance"])}</td>
            `;
          } else {
            const debit = row["Debit"];
            const credit = row["Credit"];
            tr.innerHTML = `
              <td>${row["Name"] || "—"}</td>
              <td>${formatDate(row["Date"])}</td>
              <td class="${debit ? 'debit' : ''}">${formatNumber(debit)}</td>
              <td class="${credit ? 'credit' : ''}">${formatNumber(credit)}</td>
              <td>${formatNumber(row["Balance"])}</td>
            `;
          }
          tbody.appendChild(tr);
        });

        // Auto-scroll to BOTTOM after rendering (shows newest entries)
        setTimeout(() => {
          container.scrollTop = container.scrollHeight;
        }, 100);

        // Update timestamp
        document.querySelector(".last-updated").textContent = 
          "Last updated: " + new Date().toLocaleString('en-IN');
      },
      error: function(error) {
        document.getElementById("ledger-body").innerHTML = 
          `<tr><td colspan="5" style="text-align: center; color: var(--debit);">Failed to load ledger</td></tr>`;
        console.error("CSV Load Error:", error);
      }
    });
  </script>
</body>
</html>
